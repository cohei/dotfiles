name: Auto-rebase

on:
  push:
    branches: [master]

jobs:
  rebase:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_APP_PRIVATE_KEY }}
      - uses: peter-evans/rebase@v4.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: master
          include-labels: 'auto-rebase'
