name: Testing

on:
  push:
    branches-ignore: ['update-*']
  pull_request:

concurrency:
  group: ${{ case(startsWith(github.head_ref, 'update-'), 'flake-updates', github.run_id) }}
  cancel-in-progress: ${{ startsWith(github.head_ref, 'update-') }}

permissions:
  contents: read

jobs:
  local-activate-test:
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@v2.0.0
      - uses: actions/checkout@v7.0.1
      - run: docker compose run development nix run
  local-darwin-activate-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: NixOS/nix-installer-action@v1.0.0
      - name: Prepare for nix-darwin
        run: |
          sudo scutil --set LocalHostName sandbox-mac
          sudo rm /etc/nix/nix.conf /etc/nix/nix.custom.conf /etc/shells
      - run: sudo env NIX_CONFIG="$(cat nix-preamble.conf)" nix run
        timeout-minutes: 20
  network-activate-test:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@v2.0.0
      - uses: actions/checkout@v7.0.1
      - run: docker compose run --env NIX_CONFIG development nix run github:cohei/dotfiles
        env:
          NIX_CONFIG: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
