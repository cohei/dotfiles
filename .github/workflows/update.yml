name: Update

on:
  workflow_dispatch:
  schedule:
    - cron: '3 0 * * 6' # runs weekly on Saturday at 00:03

jobs:
  update-flake-lock:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }} # to trigger CI on pull requests created by update-flake-inputs
      - uses: NixOS/nix-installer-action@v1.0.0
      - uses: Mic92/update-flake-inputs@v1.0.4
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          auto-merge: 'true'
          auto-merge-method: 'REBASE'
          pr-labels: 'dependencies,auto-rebase'
