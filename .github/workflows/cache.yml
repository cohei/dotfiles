name: Cache

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emacs:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: NixOS/nix-installer-action@v1.0.0
      - uses: cachix/cachix-action@v17
        with:
          name: cohei-emacs-overlay-packages
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build .#emacs
